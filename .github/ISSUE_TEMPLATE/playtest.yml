name: Playtest result
description: Report rendering, gameplay, or performance findings from your local build.
title: "[Playtest] "
labels: [playtest]
body:
  - type: markdown
    attributes:
      value: "Please do not attach game files, shaders/caches, generated code, saves, or memory dumps. Review log excerpts for personal paths."
  - type: input
    id: revision
    attributes:
      label: Release or commit tested
      description: Release tag and output of git rev-parse --short HEAD, including whether you changed the source.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Hardware and settings
      description: Windows build, CPU, GPU/VRAM, RAM, driver, display resolution/refresh, aspect, render scale, guest refresh setting, and changed options.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Scene and reproduction steps
      description: What happened, what you expected, and how to reproduce it. Successful playtests are welcome; specify exactly what you completed.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Native versus fallback comparison
      description: Does F5 change the problem? Were local shaders prepared and warm? Give measurement windows for performance claims.
  - type: textarea
    id: notes
    attributes:
      label: Additional observations
